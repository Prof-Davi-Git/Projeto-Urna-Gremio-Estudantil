<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e4eaf3">
  <title>Votação do Grêmio Estudantil | E.E. Prof. Armando Gomes de Araújo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="urna" aria-label="Painel de votação do Grêmio Estudantil">
    <!-- A imagem original é recortada visualmente: sem topo, laterais e fundo da caixa. -->
    <img class="arte" src="urna.webp" draggable="false" alt="Painel frontal da urna do Grêmio Estudantil com logotipos da escola e teclado">
    <section class="visor" id="visor" aria-live="polite" aria-atomic="true"></section>
    <div id="teclado" class="teclado" aria-label="Teclas da urna"></div>
  </main>
  <button id="tela-cheia" class="tela-cheia" type="button" aria-label="Ativar tela cheia" title="Ativar tela cheia">⛶</button>
  <script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lista de assinaturas | Grêmio Estudantil</title>
<style>
 *{box-sizing:border-box}
 body{font:14px Arial,Helvetica,sans-serif;color:#111;max-width:820px;margin:20px auto;padding:0 15px}
 h1{font-size:20px;margin-bottom:5px}
 .linha{margin-bottom:16px}
 table{width:100%;border-collapse:collapse;table-layout:fixed}
 th,td{border:1px solid #333;padding:5px 8px;height:33px}
 th{background:#eaeaea}
 .numero{width:90px;text-align:center}
 .assinatura{width:auto}
 .turma{width:120px}
 .page{page-break-after:always;break-after:page}
 .page:last-child{page-break-after:auto;break-after:auto}
 .botao{padding:10px 17px;background:#153d6a;color:white;border:0;border-radius:8px;cursor:pointer}
 .rodape{margin-top:13px;font-size:11px;color:#444}
 @page{size:A4 portrait;margin:13mm}
 @media print{
  body{max-width:none;margin:0;padding:0;font-size:12px}
  .botao,.explanation{display:none}
  th,td{height:26px;padding:3px 7px}
  h1{font-size:16px}
 }
</style>
</head>
<body>
<button class="botao" onclick="window.print()">Imprimir folha(s) de assinaturas</button>
<p class="explanation">Quatro folhas numeradas (1 a 100). Imprima as necessárias. Nesta lista o aluno assina antes de votar. <strong>A lista, cruzada com o arquivo de votos em ordem, permite saber a escolha de cada aluno.</strong> Guarde os dois documentos com acesso restrito.</p>
<div id="paginas"></div>
<script>
const raiz=document.getElementById('paginas');
for(let pagina=0;pagina<4;pagina++){
 const folha=document.createElement('section');
 folha.className='page';
 folha.innerHTML='<h1>GRÊMIO ESTUDANTIL — REGISTRO DE PRESENÇA</h1><p class="linha">E.E. Prof. Armando Gomes de Araújo &nbsp;&nbsp; Data: ____/____/________ &nbsp;&nbsp; Folha '+(pagina+1)+'/4</p><table><thead><tr><th class="numero">Ordem</th><th class="assinatura">Assinatura do estudante</th><th class="turma">Turma (opcional)</th></tr></thead><tbody></tbody></table><p class="rodape">Registro de atendimento. Ao relacionar esta ordem ao histórico digital, é possível identificar as escolhas. Acesso restrito à comissão.</p>';
 const tbody=folha.querySelector('tbody');
 for(let n=pagina*25+1;n<=pagina*25+25;n++){
   const row=document.createElement('tr');
   const number=document.createElement('td');
   number.className='numero';
   number.textContent=n+'º voto';
   row.append(number,document.createElement('td'),document.createElement('td'));
   tbody.append(row);
 }
 raiz.append(folha);
}
</script>
</body></html>
